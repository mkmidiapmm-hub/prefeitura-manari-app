<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073a22">
  <meta name="description" content="Aplicativo oficial da Prefeitura Municipal de Manari - serviços, secretarias, notícias e atendimento ao cidadão.">
  <title>Prefeitura de Manari</title>
  <link rel="canonical" href="https://www.manari.pe.gov.br/">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png">
  <link rel="apple-touch-icon" href="/app-icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" data-divino-natal="true" href="divino-natal-theme.css?v=6.47">
  <link rel="stylesheet" href="health-units.css?v=6.34">
  <link rel="stylesheet" href="secretariat-logos.css?v=6.48">
  <link rel="stylesheet" href="climate-notice.css?v=6.42">
  <link rel="stylesheet" href="weather-now.css?v=6.50">
  <link rel="stylesheet" href="enrollment-popup.css?v=6.36">
  <link rel="stylesheet" href="education-enrollment-banner.css?v=6.39">
  <link rel="stylesheet" href="security-portal.css?v=6.30">
  <style>
    .citizen-shortcuts{flex:1 1 220px;min-width:0}
    .citizen-shortcuts a{color:inherit;text-decoration:underline;text-underline-offset:3px;line-height:1.6}
    .citizen-shortcuts a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
  </style>
<link rel="stylesheet" href="/visit-counter.css?v=6.49"><script defer src="/visit-counter.js?v=6.49"></script><link rel="stylesheet" href="visual-layout.css?v=6.52"></head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeBtn" aria-label="Ir para início">
        <img src="assets/secretarias/prefeitura.png" alt="Prefeitura Municipal de Manari">
      </button>
      <nav class="desktop-menu" aria-label="Menu principal">
        <button data-route="home" class="menu-link active">Início</button>
        <button id="scrollSecretarias" class="menu-link">Secretarias</button>
        <button id="scrollServicos" class="menu-link">Serviços</button>
        <button id="newsBtn" class="menu-link">Notícias</button>
        <button id="galleryBtn" class="menu-link">Galeria</button>
      </nav>
      <div class="top-actions">
        <button id="installBtn" class="ghost-btn hidden">Instalar</button>
        <button id="openServices" class="primary-btn">Acessar serviços <span>›</span></button>
      </div>
    </header>

    <main id="mainView" class="main-view" aria-live="polite"></main>

    <footer class="footer">
      <div class="footer-col">
        <strong>Prefeitura Municipal de Manari</strong>
        <span>Rua Nova, s/n, Centro • Manari - PE • CEP 56.565-000</span>
      </div>
      <div class="footer-col">
        <strong>Atendimento ao cidadão</strong>
        <span>Segunda a sexta-feira • 7h às 13h • 0800-666-9090</span>
      </div>
      <nav class="footer-col citizen-shortcuts" aria-label="Serviços ao cidadão">
        <strong>Acesso rápido</strong>
        <a href="/localizacao">Localização e contato</a>
        <a href="/ouvidoria/">Ouvidoria</a>
        <a href="/noticias">Notícias</a>
        <a href="/transparencia/">Portal da Transparência</a>
      </nav>
      <div class="footer-col footer-actions">
        <button id="mediaManagerBtn" class="footer-btn" data-nosnippet>⚙ Acesso administrativo</button>
        <button id="installFooterBtn" class="footer-btn">＋ Instalar aplicativo</button>
      </div>
    </footer>

    <div class="mobile-bottom-nav">
      <button data-route="home" class="mobile-nav-btn active"><span>⌂</span>Início</button>
      <button id="mobileSecretarias" class="mobile-nav-btn"><span>▦</span>Secretarias</button>
      <button id="mobileServicos" class="mobile-nav-btn"><span>✦</span>Serviços</button>
      <button id="mobileMenu" class="mobile-nav-btn"><span>☰</span>Mais</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <div id="adminModal" data-nosnippet class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="modal-card admin-modal-card">
      <div class="modal-head">
        <div>
          <span class="eyebrow">PAINEL ADMINISTRATIVO</span>
          <h2 id="adminTitle">Gerenciador de imagens</h2>
        </div>
        <button id="closeAdmin" class="icon-btn" aria-label="Fechar">×</button>
      </div>
      <div id="adminAuth"></div>
      <div id="mediaManager" class="hidden"></div>
    </div>
  </div>

  <div id="simpleModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head"><h2 id="simpleModalTitle">Informação</h2><button id="closeSimpleModal" class="icon-btn">×</button></div>
      <div id="simpleModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script>
  <script src="security-portal.js?v=6.30"></script>
  <link rel="stylesheet" href="portal-sector-services.css?v=6.32">
  <script src="portal-sector-services.js?v=6.48"></script>
  <script src="health-units.js?v=6.34"></script>
  <script src="app.js?v=6.34"></script>
<script src="sidebar-menu.js?v=6.48"></script><script src="enrollment-popup.js?v=6.36"></script><script src="education-enrollment-banner.js?v=6.39"></script><script src="climate-notice.js?v=6.42"></script><script src="weather-now.js?v=6.50"></script><script src="secretariat-logos.js?v=6.48"></script><script defer src="visual-layout-model.js?v=6.52"></script><script defer src="visual-layout-runtime.js?v=6.52"></script><script defer src="visual-layout-editor.js?v=6.52"></script>
</body>
</html>
