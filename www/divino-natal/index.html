<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062b17"><title>Divino Natal • Dado 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#195b32,#041b10 80%);color:#fff1c8;font:16px system-ui;text-align:center;min-height:100dvh}main{max-width:480px;margin:auto;padding:16px 20px}header img{width:min(58vw,245px);border-radius:24px;display:block;margin:auto}h1{font-size:16px;letter-spacing:3px;margin:8px 0 22px}button{font:inherit;font-weight:700;cursor:pointer;border:1px solid #d4ae56;border-radius:12px;padding:12px;color:#ffe5a4;background:#123e29}button[aria-pressed=true]{background:linear-gradient(#ffe6a1,#c99b40);color:#18321c}button:disabled{opacity:.65}.modes{display:flex;gap:10px}.modes button{flex:1}.stage{height:190px;display:flex;align-items:center;justify-content:center;gap:38px;perspective:700px}.cube{width:90px;height:90px;position:relative;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(24deg);transition:transform 1.2s cubic-bezier(.16,.65,.2,1)}.face{position:absolute;inset:0;background:linear-gradient(135deg,#fffef5,#e8d4a2);border:2px solid #d2a84d;border-radius:9px;box-shadow:inset 0 0 9px #a98742;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;backface-visibility:hidden}.pip{width:15px;height:15px;background:#103c25;border-radius:50%;align-self:center;justify-self:center;box-shadow:inset 0 2px 3px #0009}.stagewrap{position:relative}.stagewrap:before{content:'';position:absolute;bottom:25px;left:20%;width:60%;height:20px;background:#0009;filter:blur(10px);border-radius:50%}#result{font-size:28px;font-weight:800;margin:5px 0 18px}#roll{width:100%;background:linear-gradient(#d62b27,#8d1015);border:2px solid #f2c86d;font-size:20px;padding:16px}footer{border-top:1px solid #cba85b66;margin-top:24px;padding:15px;font-size:13px}#install{margin-top:12px} [hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.cube{transition-duration:.05s}}
#welcome,#identify,#menu{padding:22px 0}#welcome button,#identify button,#menu button{display:block;width:100%;margin:12px 0;padding:18px;font-size:20px}#name{width:100%;padding:15px;border-radius:10px;border:1px solid #d4ae56;font:inherit}#welcome button,#identify button{background:linear-gradient(#d62b27,#8d1015)}#menu button small{display:block;font-size:13px;font-weight:400;margin-top:8px}main{border:3px double #d4ae56;border-radius:20px;margin:12px auto;max-width:min(480px,96vw)}#back{margin-bottom:10px}footer img{max-width:210px;max-height:100px;object-fit:contain}</style></head><body><main style="visibility:visible!important"><header><img src="./logo.svg" alt="Divino Natal"><h1>DESAFIOS DA TRILHA</h1></header><section id="welcome"><h2>Bem-vindo ao Divino Natal</h2><p>Uma aventura pelos desafios da trilha.</p><button id="start">INICIAR JOGO</button></section><section id="identify" hidden><h2>Quem vai jogar?</h2><form id="profile"><label for="name">Nome do jogador</label><input id="name" required maxlength="50" autocomplete="given-name" placeholder="Digite seu nome"><button>CONTINUAR</button></form></section><section id="menu" hidden><h2 id="greeting"></h2><button id="physical">JOGAR OS DADOS<small>Para o tabuleiro físico na praça</small></button><button id="digital">JOGAR O TABULEIRO<small>Modalidade digital em desenvolvimento</small></button><p id="notice" hidden>O tabuleiro digital ainda não está disponível.</p></section><section id="dicegame" hidden><button id="back">Voltar ao menu</button><div class="modes"><button id="one" aria-pressed="true">1 dado · Normal</button><button id="two" aria-pressed="false">2 dados · Rápido</button></div><div class="stagewrap"><div class="stage"><div class="cube"></div><div class="cube" hidden></div></div></div><div id="detail">Escolha o modo e lance o dado</div><div id="result" aria-live="polite">Pronto para jogar?</div><button id="roll">LANÇAR DADO</button><button id="install" hidden>Instalar aplicativo</button></section><footer><img src="../assets/secretarias/prefeitura.png" alt="Prefeitura Municipal de Manari"><br>Prefeitura Municipal de Manari – Pernambuco<br>Divino Natal • Dado digital</footer></main><script>
const cubes=[...document.querySelectorAll('.cube')],one=document.querySelector('#one'),two=document.querySelector('#two'),roll=document.querySelector('#roll'),detail=document.querySelector('#detail'),result=document.querySelector('#result');const pips=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]],faces=['rotateY(0deg)','rotateY(90deg)','rotateX(-90deg)','rotateX(90deg)','rotateY(-90deg)','rotateY(180deg)'],angles=[[0,0],[0,-90],[90,0],[-90,0],[0,90],[0,180]];let mode=1,turn=0;for(const c of cubes)faces.forEach((t,i)=>{let f=document.createElement('div');f.className='face';f.style.transform=t+' translateZ(45px)';for(let j=0;j<9;j++){let s=document.createElement('span');if(pips[i].includes(j))s.className='pip';f.append(s)}c.append(f)});function choose(n){mode=n;one.setAttribute('aria-pressed',n===1);two.setAttribute('aria-pressed',n===2);cubes[1].hidden=n===1;result.textContent='Pronto para jogar?';detail.textContent=n===1?'Modo normal':'Modo rápido';roll.textContent=n===1?'LANÇAR DADO':'LANÇAR DADOS'}one.onclick=()=>choose(1);two.onclick=()=>choose(2);function random(){let a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%6+1}roll.onclick=()=>{one.disabled=two.disabled=roll.disabled=true;detail.textContent='Lançando…';result.textContent='…';turn+=3;let values=Array.from({length:mode},random);values.forEach((n,i)=>{let [x,y]=angles[n-1];cubes[i].style.transform=`rotateX(${turn*360+x}deg) rotateY(${turn*360+y}deg)`});setTimeout(()=>{let sum=values.reduce((a,b)=>a+b,0);detail.textContent=mode===2?values.join(' + ')+' = '+sum:'Resultado do lançamento';result.textContent='Avance '+sum+(sum===1?' casa!':' casas!');one.disabled=two.disabled=roll.disabled=false},1250)};let promptInstall;const install=document.querySelector('#install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e;install.hidden=false});install.onclick=async()=>{if(promptInstall){await promptInstall.prompt();install.hidden=true;promptInstall=null}};
const el=id=>document.getElementById(id);function screen(id){for(const k of ['welcome','identify','menu','dicegame'])el(k).hidden=k!==id;}el('start').onclick=()=>screen('identify');try{el('name').value=localStorage.getItem('divino-natal-name')||''}catch{}el('profile').onsubmit=e=>{e.preventDefault();let n=el('name').value.trim();if(!n)return;try{localStorage.setItem('divino-natal-name',n)}catch{}el('greeting').textContent='Olá, '+n+'!';screen('menu')};el('physical').onclick=()=>screen('dicegame');el('digital').onclick=()=>{el('notice').hidden=false};el('back').onclick=()=>screen('menu');</script></body></html>
