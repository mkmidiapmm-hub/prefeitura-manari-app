const cubes=[...document.querySelectorAll('.cube')],one=document.querySelector('#one'),two=document.querySelector('#two'),roll=document.querySelector('#roll'),detail=document.querySelector('#detail'),result=document.querySelector('#result');const pips=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]],faces=['rotateY(0deg)','rotateY(90deg)','rotateX(-90deg)','rotateX(90deg)','rotateY(-90deg)','rotateY(180deg)'],angles=[[0,0],[0,-90],[90,0],[-90,0],[0,90],[0,180]];let mode=1,turn=0;for(const c of cubes)faces.forEach((t,i)=>{let f=document.createElement('div');f.className='face';f.style.transform=t+' translateZ(45px)';for(let j=0;j<9;j++){let s=document.createElement('span');if(pips[i].includes(j))s.className='pip';f.append(s)}c.append(f)});function choose(n){mode=n;one.setAttribute('aria-pressed',n===1);two.setAttribute('aria-pressed',n===2);cubes[1].hidden=n===1;result.textContent='Pronto para jogar?';detail.textContent=n===1?'Modo normal':'Modo rápido';roll.textContent=n===1?'LANÇAR DADO':'LANÇAR DADOS'}one.onclick=()=>choose(1);two.onclick=()=>choose(2);function random(){let a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%6+1}roll.onclick=()=>{one.disabled=two.disabled=roll.disabled=true;detail.textContent='Lançando…';result.textContent='…';turn+=3;let values=Array.from({length:mode},random);values.forEach((n,i)=>{cubes[i].classList.remove("bounce");void cubes[i].offsetWidth;cubes[i].classList.add("bounce");let [x,y]=angles[n-1];cubes[i].style.transform=`rotateX(${turn*360+x}deg) rotateY(${turn*360+y}deg)`});setTimeout(()=>{let sum=values.reduce((a,b)=>a+b,0);detail.textContent=mode===2?values.join(' + ')+' = '+sum:'Resultado do lançamento';result.textContent='Avance '+sum+(sum===1?' casa!':' casas!');one.disabled=two.disabled=roll.disabled=false},1250)};cubes.forEach(c=>c.onclick=()=>{if(!roll.disabled)roll.click()});choose(1);</script></body></html>
